name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run tests with unfiltered JaCoCo report
        run: |
          chmod +x gradlew
          ./gradlew test jacocoFullReport jacocoFullCoverageVerification --no-daemon

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, os
          import xml.etree.ElementTree as ET
          path = "build/reports/jacoco/full/jacocoFullReport.xml"
          print("## Test and coverage")
          if os.path.exists(path):
              root = ET.parse(path).getroot()
              for c in root.findall("counter"):
                  if c.get("type") in ("LINE", "BRANCH"):
                      cov, miss = int(c.get("covered")), int(c.get("missed"))
                      print(f"- {c.get('type').title()} coverage: {100 * cov / (cov + miss):.1f}% ({cov}/{cov + miss})")
          tests = fails = 0
          for f in glob.glob("build/test-results/test/*.xml"):
              attrs = ET.parse(f).getroot().attrib
              tests += int(attrs["tests"]); fails += int(attrs["failures"]) + int(attrs["errors"])
          print(f"- Tests: {tests}, failed: {fails}")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/full
          retention-days: 14

  docker:
    name: Docker image and vulnerability scan
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: financecare-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the build on fixable CRITICAL vulnerabilities in the image. Raise to HIGH once the backlog is clear.
      # Runs the official Trivy image directly: aquasecurity/trivy-action's installer failed on the runner (curl exit 6).
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.76.1 image \
            --severity CRITICAL --ignore-unfixed --ignorefile /.trivyignore --exit-code 1 \
            financecare-backend:${{ github.sha }}
