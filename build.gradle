plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.5.0.8588"
    id 'jacoco'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'capstone project'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

// Security fixes that are newer than the Spring Boot 3.5.16 BOM (found by the Trivy scan in CI).
// Remove these overrides once the Boot BOM catches up.
ext['tomcat.version'] = '10.1.61'
ext['netty.version'] = '4.1.140.Final'

dependencies {
    constraints {
        implementation('org.bouncycastle:bcprov-jdk18on:1.85') {
            because 'bcprov 1.76 (via the Firebase/Google client libraries) has CRITICAL advisories fixed in 1.84/1.85'
        }
    }

    //login dependencies
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.data:spring-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation("com.google.api-client:google-api-client:2.8.1")
    implementation("com.google.http-client:google-http-client-jackson2:2.0.2")
    implementation 'com.google.firebase:firebase-admin:9.4.3'
    implementation 'io.minio:minio:8.5.7'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.21'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.21'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // run jacoco after tests
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/com/example/capstone/config/**',
                '**/com/example/capstone/entity/**',
                '**/com/example/capstone/enums/**',
                '**/com/example/capstone/dto/**',
                '**/com/example/capstone/exception/**',
                '**/com/example/capstone/controller/**',
                '**/com/example/capstone/constant/**',
                '**/com/example/capstone/domain/**',
                '**/com/example/capstone/security/**',
                '**/com/example/capstone/repository/**',
                '**/com/example/capstone/engineImp/**',
                '**/com/example/capstone/allocation/**',
                '**/com/example/capstone/strategy/**',
                '**/com/example/capstone/service/NotificationService*',
                '**/com/example/capstone/service/DebtService*',
                '**/com/example/capstone/service/JoobleService*',
                '**/com/example/capstone/service/BudgetService*',
                '**/com/example/capstone/service/MinioService*',
                '**/com/example/capstone/service/UserService*',
                '**/com/example/capstone/service/TransactionService*',
                '**/com/example/capstone/service/SlipService*',
                '**/com/example/capstone/service/RepaymentPlanService*',
                '**/com/example/capstone/service/RepaymentService*',
                '**/com/example/capstone/service/OcrService*',
                '**/com/example/capstone/CapstoneApplication*'
            ])
        }))
    }
}

// Unfiltered report: the report above excludes most services/engines/controllers, so it overstates coverage.
tasks.register('jacocoFullReport', JacocoReport) {
    dependsOn test
    executionData(test)
    sourceSets sourceSets.main
    reports {
        xml.required = true
        html.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/full/jacocoFullReport.xml')
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/full/html')
    }
}

// Lint: low-churn hygiene rules (unused imports, trailing whitespace, final newline), checked only on files that
// changed compared to origin/main, so the existing code base does not need a big-bang cleanup.
// Run `./gradlew spotlessApply` to fix. CI runs spotlessCheck on pull requests.
spotless {
    ratchetFrom 'origin/main'
    lineEndings = com.diffplug.spotless.LineEnding.UNIX   // the repository stores LF
    java {
        target 'src/**/*.java'
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Coverage ratchet on the unfiltered numbers: raise these when coverage goes up, never lower them.
// Reached: service package 81.9%, overall 71.7% (they were 49.9% / 51.3% when the gate was added).
tasks.register('jacocoFullCoverageVerification', JacocoCoverageVerification) {
    dependsOn test
    executionData(test)
    sourceSets sourceSets.main
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.example.capstone.service']
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

sonar {
    properties {
        property "sonar.projectKey", "financecare-backend"
        property "sonar.projectName", "FinanceCare Backend"
        property "sonar.host.url", "http://localhost:9005"
        property "sonar.coverage.jacoco.xmlReportPaths", "${project.layout.buildDirectory.get().asFile}/reports/jacoco/test/jacocoTestReport.xml"
        property "sonar.coverage.exclusions", "**/config/**/*,**/entity/**/*,**/enums/**/*,**/dto/**/*,**/exception/**/*,**/controller/**/*,**/constant/**/*,**/domain/**/*,**/security/**/*,**/repository/**/*,**/engineImp/**/*,**/allocation/**/*,**/strategy/**/*,**/*Application*,**/service/NotificationService.java,**/service/DebtService.java,**/service/JoobleService.java,**/service/BudgetService.java,**/service/MinioService.java,**/service/UserService.java,**/service/TransactionService.java,**/service/SlipService.java,**/service/RepaymentPlanService.java,**/service/RepaymentService.java,**/service/OcrService.java"
    }
}


