spring.application.name=capstone
server.port=8080
server.servlet.context-path=/api
spring.jackson.time-zone=Asia/Bangkok

#dev
spring.datasource.url=jdbc:postgresql://localhost:5432/financeCare_DB
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=127.0.0.1 
spring.data.redis.port=6379
spring.data.redis.timeout=5000
spring.data.redis.repositories.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

line.channel-id=2008279064

app.mail.enabled=true

# Google Sign-In (Web client ID) - audience ที่ backend ใช้ตรวจ idToken
app.google.client-id=${GOOGLE_CLIENT_ID:756271821434-vpmof8n9b53p89osfrfeibtk83tvqo1h.apps.googleusercontent.com}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Enable Custom 404 Handling (ปรับให้รองรับ Swagger Static Resources)
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true

# JWT Configuration (ms)
# 7 days = 604800000
jwt.expiration=604800000
# 30 days = 2592000000
jwt.refresh-expiration=2592000000
jwt.secret=${JWT_SECRET}
# Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
app.slip.max-count=50

app.ocr.url=http://easyocr-service:8000/slip/verify
app.minio.url=http://127.0.0.1:9000
app.minio.access-key=admin
app.minio.secret-key=${MINIO_SECRET_KEY}

# Jooble API
app.jooble.api-key=${JOOBLE_API_KEY}
app.jooble.url=https://th.jooble.org/api/

# Demo mode - เปิดด้วย DEMO_SEED_ENABLED=true: เปิด POST /auth/demo-login ที่สร้างผู้ใช้ + ข้อมูลตัวอย่างตอนกดครั้งแรก
app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
app.demo-seed.email=demo@financecare.com
app.demo-seed.password=Demo@1234

# Observability
# Metrics live on their own port so /actuator is not reachable through the public API port.
management.server.port=${MANAGEMENT_PORT:9081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# histogram buckets so Prometheus can compute p95/p99 with histogram_quantile
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# correlation id from RequestIdFilter on every log line; set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs for JSON logs
# SMTP health check would make /health slow or fail whenever Gmail is unreachable
management.health.mail.enabled=false

# Asynchronous slip OCR pipeline (RabbitMQ). Off by default so deployments without a broker are unaffected.
app.slip.async.enabled=${SLIP_ASYNC_ENABLED:false}
app.notifications.async.enabled=${NOTIFICATIONS_ASYNC_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# 3 attempts (2 s, 4 s between them), then the message is rejected and goes to the dead-letter queue
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=5
# trace context travels in the message headers, so a slip's upload and its background OCR share one trace
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
management.health.rabbit.enabled=${SLIP_ASYNC_ENABLED:false}

# Distributed tracing (OpenTelemetry via Micrometer Tracing). Spans are exported over OTLP/HTTP to Jaeger
# (see monitoring/docker-compose.yml) only when TRACING_ENABLED=true; otherwise nothing is sampled or sent.
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# trace id next to the request id on every log line
logging.pattern.level=%5p [%X{requestId:-}] [%X{traceId:-}]
