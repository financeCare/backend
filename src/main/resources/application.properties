spring.application.name=capstone
server.port=8080
server.servlet.context-path=/api
spring.jackson.time-zone=Asia/Bangkok

#dev
spring.datasource.url=jdbc:postgresql://localhost:5432/financeCare_DB
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=127.0.0.1 
spring.data.redis.port=6379
spring.data.redis.timeout=5000
spring.data.redis.repositories.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

line.channel-id=2008279064

app.mail.enabled=true

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

# Enable Custom 404 Handling (ปรับให้รองรับ Swagger Static Resources)
spring.mvc.throw-exception-if-no-handler-found=false
spring.web.resources.add-mappings=true

# JWT Configuration (ms)
# 7 days = 604800000
jwt.expiration=604800000
# 30 days = 2592000000
jwt.refresh-expiration=2592000000
jwt.secret=${JWT_SECRET}
# Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
app.slip.max-count=50

app.ocr.url=http://easyocr-service:8000/slip/verify
app.minio.url=http://127.0.0.1:9000
app.minio.access-key=admin
app.minio.secret-key=${MINIO_SECRET_KEY}

# Jooble API
app.jooble.api-key=${JOOBLE_API_KEY}
app.jooble.url=https://th.jooble.org/api/
