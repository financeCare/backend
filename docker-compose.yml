version: "3.8"

services:
  app:
    build: .
    container_name: spring-app
    ports:
      # ถ้าคุณจะใช้ Nginx/Proxy มาขวาง ให้เปลี่ยนเป็น "127.0.0.1:8080:8080"
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/financeCare_DB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      APP_OCR_URL: http://easyocr-service:7860/slip/verify
      # async slip OCR pipeline (see docs/async-slip-pipeline.md); the synchronous /slips/upload keeps working without it
      SLIP_ASYNC_ENABLED: "true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: financecare
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in the environment or an .env file}
      APP_MINIO_URL: http://minio-service:9000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:?set MAIL_USERNAME in .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:?set JOOBLE_API_KEY in .env}
      # ... (environment อื่นๆ คงเดิม)
    networks:
      - finance-net
    restart: always
    depends_on:
      - redis
      - easyocr
      - minio
      - rabbitmq

  redis:
    image: redis:7.2
    container_name: redis
    # ลบ ports: - "6379:6379" ออกไปเลย
    # เพราะ spring-app คุยผ่านชื่อ "redis" ใน finance-net ได้อยู่แล้ว
    networks:
      - finance-net
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: financecare
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in the environment or an .env file}
    # no published ports: the app reaches it as "rabbitmq" on finance-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - finance-net
    restart: always

  # Optional payment event log (docs/kafka-payment-events.md). Start with: docker compose --profile kafka up -d
  # and set KAFKA_EVENTS_ENABLED=true KAFKA_BOOTSTRAP_SERVERS=kafka:9092 on the app. Single node, KRaft (no ZooKeeper).
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["kafka"]
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - finance-net
    restart: unless-stopped

  easyocr:
    build:
      context: ../../ocr/easyOcr
    container_name: easyocr-service
    # ลบ ports: - "8000:8000" ออก
    # เพราะ spring-app คุยผ่าน http://easyocr-service:7860 ภายในเครือข่ายได้
    volumes:
      - easyocr_data:/home/user/.EasyOCR
    networks:
      - finance-net
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: minio-service
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      # ... (environment อื่นๆ คงเดิม)
    ports:
      # ถ้าต้องเข้าหน้า Console จากข้างนอก ให้เปิดไว้ หรือใช้ Proxy ขวาง
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - finance-net
    restart: unless-stopped

networks:
  finance-net:
    external: true

volumes:
  rabbitmq_data:
  kafka_data:
  easyocr_data:
  minio_data: