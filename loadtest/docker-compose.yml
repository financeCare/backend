# Isolated Postgres + Redis for load testing (does not touch the real DB)
services:
  postgres:
    image: postgres:16
    container_name: lt-postgres
    environment:
      POSTGRES_DB: financeCare_DB
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password123
    ports:
      - "55432:5432"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "max_connections=200"]
  redis:
    image: redis:7.2
    container_name: lt-redis
    ports:
      - "56379:6379"
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: lt-rabbitmq
    ports:
      - "55672:5672"
      - "55673:15672"
  minio:
    image: minio/minio
    container_name: lt-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: loadtest-minio-pw
    ports:
      - "59000:9000"
